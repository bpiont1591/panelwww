<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDA Ultimate Player - Obejdź Premium</title>
    <!-- Biblioteka HLS.js do odtwarzania strumieni m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            width: 95%;
            max-width: 800px;
            text-align: center;
            border: 1px solid #333;
        }
        h1 { margin-top: 0; color: #ffcc00; font-size: 24px; }
        input[type="text"] {
            width: 85%;
            padding: 14px;
            border: 2px solid #444;
            border-radius: 6px;
            background: #2a2a2a;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #ffcc00; }
        
        button {
            padding: 14px 28px;
            background-color: #ffcc00;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
        }
        button:hover { background-color: #ffd633; transform: scale(1.02); }
        button:disabled { background-color: #666; cursor: not-allowed; }

        #status { 
            margin-top: 15px; 
            font-size: 14px; 
            min-height: 20px; 
        }

        /* Kontener wideo */
        #video-wrapper {
            margin-top: 25px;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            min-height: 200px;
            display: none;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 600px;
            display: block;
        }
        
        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-secondary {
            background-color: #444;
            color: white;
            font-size: 14px;
            padding: 10px 20px;
        }
        .btn-secondary:hover { background-color: #555; }

        .note {
            font-size: 0.85em;
            color: #777;
            margin-top: 20px;
            text-align: left;
            background: #181818;
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid #ffcc00;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 CDA Ultimate Player</h1>
    <p>Wklej link do filmu (np. https://www.cda.pl/video/...)</p>
    
    <input type="text" id="urlInput" placeholder="https://www.cda.pl/video/nazwa_filmu">
    <button id="playBtn" onclick="startPlayer()">▶ Uruchom Film</button>
    
    <div id="status"></div>

    <div id="video-wrapper">
        <video id="mainVideo" controls autoplay playsinline></video>
        <div style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.7); padding:5px; border-radius:4px; font-size:12px;">
            Status: <span id="playerStatus">...</span>
        </div>
    </div>

    <div class="actions" id="downloadActions" style="display:none;">
        <button class="btn-secondary" onclick="downloadFile('mp4')">⬇️ Pobierz MP4</button>
        <button class="btn-secondary" onclick="downloadFile('m3u8')">⬇️ Pobierz M3U8</button>
        <button class="btn-secondary" onclick="copyLink()">📋 Kopiuj Link</button>
    </div>

    <div class="note">
        <strong>Jak to działa?</strong><br>
        Skrypt używa proxy do pominięcia blokad CORS i biblioteki <code>hls.js</code> do odtwarzania strumieni wideo.<br>
        Jeśli film jest ukryty za reklamami premium, skritt spróbuje wyciągnąć bezpośredni strumień.
    </div>
</div>

<script>
    let currentM3u8Url = "";
    let currentMp4Url = "";

    async function startPlayer() {
        const input = document.getElementById('urlInput').value.trim();
        const status = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const videoWrapper = document.getElementById('video-wrapper');
        const playerStatus = document.getElementById('playerStatus');
        const downloadActions = document.getElementById('downloadActions');

        if (!input) {
            status.textContent = "⚠️ Wpisz poprawny link!";
            status.style.color = "#ff6b6b";
            return;
        }

        // Reset stanu
        status.textContent = "⏳ Łączenie z CDA przez proxy...";
        status.style.color = "#aaa";
        playBtn.disabled = true;
        videoWrapper.style.display = "none";
        downloadActions.style.display = "none";
        currentM3u8Url = "";
        currentMp4Url = "";

        try {
            // Używamy proxy allorigins.win aby ominąć CORS
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(input)}`;
            
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("Nie udało się pobraać strony.");
            
            const htmlText = await response.text();
            
            // --- WYSZUKIWANIE LINKÓW ---
            
            // 1. Szukamy MP4/FLV
            const mp4Regex = /(?:src|file)=["']([^"']*?\.(?:mp4|flv))[^"']*["']/gi;
            let match = mp4Regex.exec(htmlText);
            let foundMp4 = null;
            
            while (match) {
                let url = match[1];
                if (url.startsWith('//')) url = 'https:' + url;
                else if (!url.startsWith('http')) url = 'https://' + url;
                foundMp4 = url;
                break;
            }

            // 2. Szukamy HLS (m3u8) - najczęstszy format dla nowoczesnych filmów
            const m3u8Regex = /(?:src|hls|m3u8)=["']([^"']*\.m3u8)[^"']*["']/gi;
            match = m3u8Regex.exec(htmlText);
            let foundM3u8 = null;
            
            while (match) {
                let url = match[1];
                if (url.startsWith('//')) url = 'https:' + url;
                else if (!url.startsWith('http')) url = 'https://' + url;
                foundM3u8 = url;
                break;
            }

            // Alternatywna metoda: szukanie w obiektach JS
            if (!foundM3u8) {
                const jsRegex = /['"]((https?:\/\/[^'"]+\.m3u8))['"]/g;
                const jsMatch = jsRegex.exec(htmlText);
                if (jsMatch) foundM3u8 = jsMatch[1];
            }

            if (foundM3u8 || foundMp4) {
                status.innerHTML = `<span style="color:#6bff6b">✅ Znaleziono źródła!</span>`;
                
                // Wyświetlamy przyciski pobierania
                downloadActions.style.display = "flex";
                if(foundMp4) currentMp4Url = foundMp4;
                if(foundM3u8) currentM3u8Url = foundM3u8;

                // Próba odtworzenia
                if (foundM3u8 && Hls.isSupported()) {
                    playerStatus.textContent = "Ładowanie HLS...";
                    const video = document.getElementById('mainVideo');
                    
                    // Zatrzymamy stare streamy jeśli są
                    if (window.myHlsPlayer) window.myHlsPlayer.destroy();

                    window.myHlsPlayer = new Hls({
                        debug: false,
                        xhrSetup: (xhr) => {
                            // Dodajemy nagłówki User-Agent dla lepszej kompatybilności
                            xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
                        }
                    });
                    
                    window.myHlsPlayer.loadSource(foundM3u8);
                    window.myHlsPlayer.attachMedia(video);
                    
                    window.myHlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => console.log("Autoplay blocked", e));
                        status.innerHTML = `<span style="color:#6bff6b">✅ Gra! (HLS)</span>`;
                        playerStatus.textContent = "Gra";
                    });
                    
                    window.myHlsPlayer.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            status.innerHTML = `<span style="color:#ff6b6b">❌ Błąd strumienia. Spróbuj pobrać.</span>`;
                            playerStatus.textContent = "Błąd";
                        }
                    });

                } else if (foundMp4) {
                    playerStatus.textContent = "Ładowanie MP4...";
                    const video = document.getElementById('mainVideo');
                    video.src = foundMp4;
                    video.play().catch(e => console.log("Autoplay blocked", e));
                    status.innerHTML = `<span style="color:#6bff6b">✅ Gra! (MP4)</span>`;
                    playerStatus.textContent = "Gra";
                } else {
                    status.innerHTML = `<span style="color:#ffcc00">⚠️ Nie znaleziono linków wideo. Sprawdź konsolę (F12).</span>`;
                }
                
                videoWrapper.style.display = "block";

            } else {
                throw new Error("Brak linków MP4 lub M3U8 na stronie.");
            }

        } catch (error) {
            status.innerHTML = `<span class="error">❌ Błąd: ${error.message}</span>`;
        } finally {
            playBtn.disabled = false;
        }
    }

    function downloadFile(type) {
        const url = type === 'mp4' ? currentMp4Url : currentM3u8Url;
        if (url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = `film_cda.${type}`;
            a.target = "_blank"; // Otwiera w nowej karcie, co omija niektóre blokady pobierania
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }

    function copyLink() {
        const url = currentM3u8Url || currentMp4Url;
        if (url) {
            navigator.clipboard.writeText(url).then(() => {
                alert("Link skopiowany do schowka!");
            });
        }
    }
</script>

</body>
</html>
