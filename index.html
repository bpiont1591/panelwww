<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDA Video Player - Pro</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 900px;
            background: #2b2b2b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: #ff4d4d; margin-top: 0; }
        video {
            width: 100%;
            border-radius: 5px;
            background: #000;
        }
        .status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #aaa;
            text-align: center;
        }
        .error { color: #ff6b6b; }
        .success { color: #6bff6b; }
        
        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff4d4d;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>CDA Direct Player</h1>
    <div id="loader" class="loader"></div>
    <video id="player" controls></video>
    <div id="status" class="status">Wczytywanie...</div>
</div>

<script>
    // ID filmu z Twojego linku
    const VIDEO_ID = "32492754e3"; 
    const CDA_API_URL = `https://www.cda.pl/api.php?method=streamGetNew&data[material_id]=${VIDEO_ID}`;

    const statusEl = document.getElementById('status');
    const loader = document.getElementById('loader');
    const player = document.getElementById('player');

    async function fetchCDA() {
        showStatus("Łączenie z serwerami CDA...", "");
        loader.style.display = "block";

        try {
            // Pobieramy surowy HTML strony, aby wykruszyć tokeny i dane sesji
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.cda.pl/video/' + VIDEO_ID + '/vfilm')}`);
            if (!response.ok) throw new Error("Błąd połączenia");
            
            const data = await response.json();
            const html = data.contents;

            // Szukamy obiektu smd2 w kodzie źródłowym (to jest API CDA)
            const smdMatch = html.match(/var smd2 = JSON\.parse\(Base64\.decode\('([^']+)'\)\)/);
            if (!smdMatch) throw new Error("Nie znaleziono konfiguracji API w kodzie strony.");

            // Dekodowanie Base64
            const decodedJson = Base64.decode(smdMatch[1]);
            const smdConfig = JSON.parse(decodedJson);

            // Wywołanie metody streamGetNew przez JSON-RPC
            showStatus("Pobieranie metadanych filmu...", "");
            
            const rpcResponse = await fetch('https://www.cda.pl/api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    jsonrpc: "2.0",
                    method: "streamGetNew",
                    params: [{ material_id: parseInt(VIDEO_ID.replace('e3','')) }], // Upewnij się, że ID jest liczbą
                    id: 1
                })
            });

            const result = await rpcResponse.json();
            
            if (result.result && result.result.url) {
                const videoUrl = result.result.url;
                playVideo(videoUrl);
            } else {
                throw new Error("Brak linku do wideo w odpowiedzi API.");
            }

        } catch (err) {
            console.error(err);
            showStatus(`Błąd: ${err.message}`, "error");
            loader.style.display = "none";
        }
    }

    function playVideo(url) {
        player.src = url;
        player.play();
        showStatus("Film gotowy do oglądania!", "success");
        loader.style.display = "none";
    }

    function showStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.className = "status " + (type || "");
    }

    // Implementacja Base64 decodera (zgodna z tym co używa CDA)
    var Base64 = {
        _keyStr: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=",
        decode: function (input) {
            var output = "";
            var chr1, chr2, chr3;
            var enc1, enc2, enc3, enc4;
            var i = 0;
            input = input.replace(/[^A-Za-z0-9\+\/\=]/g, "");
            while (i < input.length) {
                enc1 = this._keyStr.indexOf(input.charAt(i++));
                enc2 = this._keyStr.indexOf(input.charAt(i++));
                enc3 = this._keyStr.indexOf(input.charAt(i++));
                enc4 = this._keyStr.indexOf(input.charAt(i++));
                chr1 = (enc1 << 2) | (enc2 >> 4);
                chr2 = ((enc2 & 15) << 4) | (enc3 >> 2);
                chr3 = ((enc3 & 3) << 6) | enc4;
                output = output + String.fromCharCode(chr1);
                if (enc3 != 64) {
                    output = output + String.fromCharCode(chr2);
                }
                if (enc4 != 64) {
                    output = output + String.fromCharCode(chr3);
                }
            }
            return output;
        }
    };

    // Start
    fetchCDA();
</script>

</body>
</html>
