<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDA Pro Player - Anti Block</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 95%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        h1 { text-align: center; color: #ff3333; margin-top: 0; font-size: 1.5rem; }
        video {
            width: 100%;
            border-radius: 4px;
            background: #000;
            max-height: 450px;
        }
        .status {
            margin-top: 15px;
            font-size: 0.85em;
            color: #aaa;
            text-align: center;
            min-height: 1.2em;
        }
        .error { color: #ff6b6b; }
        .success { color: #6bff6b; }
        
        /* Loader */
        .loader {
            border: 3px solid #333;
            border-top: 3px solid #ff3333;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>CDA Direct Stream</h1>
    <div id="loader" class="loader"></div>
    <video id="player" controls playsinline></video>
    <div id="status" class="status">Inicjalizacja...</div>
</div>

<script>
    // ID filmu z Twojego linku
    const VIDEO_ID = "32492754e3"; 
    const STATUS_EL = document.getElementById('status');
    const LOADER = document.getElementById('loader');
    const PLAYER = document.getElementById('player');

    function setStatus(msg, type = "") {
        STATUS_EL.textContent = msg;
        STATUS_EL.className = "status " + type;
    }

    async function startPlayer() {
        showLoading(true);
        setStatus("Pobieranie danych ze strony...");

        try {
            // 1. Pobieramy stronę przez proxy aby ominąć CORS
            const targetUrl = `https://www.cda.pl/video/${VIDEO_ID}/vfilm`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
            
            let pageHtml = "";
            try {
                const res = await fetch(proxyUrl, {
                    headers: {
                        // Symulacja przeglądarki
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                    }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                pageHtml = await res.text();
            } catch (e) {
                throw new Error("Nie udało się pobraać strony CDA. Sprawdź czy film istnieje.");
            }

            // 2. Szukamy zmiennej smd2 (JSON z danymi API)
            const match = pageHtml.match(/var smd2 = JSON\.parse\(Base64\.decode\('([^']+)'\)\)/);
            if (!match) throw new Error("Brak konfiguracji wideo na stronie.");

            // Dekodowanie Base64
            const decoded = Base64.decode(match[1]);
            const config = JSON.parse(decoded);

            setStatus("Łączenie z serwerem multimediów...");

            // 3. Wywołujemy metodę streamGetNew
            // Używamy fetch bezpośrednio do CDA, bo API zazwyczaj pozwala na żądania POST
            const apiRes = await fetch('https://www.cda.pl/api.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'User-Agent': 'Mozilla/5.0',
                    'Referer': 'https://www.cda.pl/'
                },
                body: JSON.stringify({
                    jsonrpc: "2.0",
                    method: "streamGetNew",
                    params: [{ material_id: parseInt(VIDEO_ID.replace('e3','')) }],
                    id: 1
                })
            });

            const data = await apiRes.json();
            
            if (data.result && data.result.url) {
                play(data.result.url);
            } else {
                // Alternatywna metoda: próba znalezienia direct URL w HTML
                const directMatch = pageHtml.match(/src:\s*['"]([^'"]+\.mp4[^'"]*)['"]/);
                if (directMatch) {
                    play(directMatch[1]);
                } else {
                    throw new Error("Nie znaleziono bezpośredniego linku do pliku.");
                }
            }

        } catch (err) {
            console.error(err);
            setStatus(`❌ Błąd: ${err.message}`, "error");
            showLoading(false);
        }
    }

    function play(url) {
        PLAYER.src = url;
        PLAYER.play().catch(e => console.log("Autoplay blocked:", e));
        setStatus("✅ Odtwarzanie...", "success");
        showLoading(false);
    }

    function showLoading(show) {
        LOADER.style.display = show ? "block" : "none";
    }

    // Minimalistyczny dekodera Base64 zgodny z CDA
    var Base64 = {
        _keyStr: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=",
        decode: function (input) {
            var output = "";
            var chr1, chr2, chr3;
            var enc1, enc2, enc3, enc4;
            var i = 0;
            input = input.replace(/[^A-Za-z0-9\+\/\=]/g, "");
            while (i < input.length) {
                enc1 = this._keyStr.indexOf(input.charAt(i++));
                enc2 = this._keyStr.indexOf(input.charAt(i++));
                enc3 = this._keyStr.indexOf(input.charAt(i++));
                enc4 = this._keyStr.indexOf(input.charAt(i++));
                chr1 = (enc1 << 2) | (enc2 >> 4);
                chr2 = ((enc2 & 15) << 4) | (enc3 >> 2);
                chr3 = ((enc3 & 3) << 6) | enc4;
                output = output + String.fromCharCode(chr1);
                if (enc3 != 64) output += String.fromCharCode(chr2);
                if (enc4 != 64) output += String.fromCharCode(chr3);
            }
            return output;
        }
    };

    // Start
    startPlayer();
</script>

</body>
</html>
